name: Deploy Jekyll site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: [$default-branch]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04-x64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 1: Install dependencies (including necessary libraries for Ruby build)
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libreadline-dev zlib1g-dev git curl

      # Step 2: Install ruby-build
      - name: Install ruby-build
        run: |
          git clone https://github.com/rbenv/ruby-build.git ~/.ruby-build
          export PATH="$HOME/.ruby-build/bin:$PATH"

      # Step 3: Install Ruby (example: Ruby 3.1.4)
      - name: Install Ruby 3.1.4 using ruby-build
        run: |
          ruby-build 3.1.4 /opt/hostedtoolcache/Ruby/3.1.4/x64

      # Step 4: Mark Ruby as installed
      - name: Mark Ruby as installed
        run: |
          touch /opt/hostedtoolcache/Ruby/3.1.4/x64.complete

      # Step 5: Install Bundler
      - name: Install Bundler
        run: gem install bundler

      # Step 6: Install required gems (via Bundler)
      - name: Install Ruby gems
        run: bundle install

      # Step 7: Setup Pages for GitHub Pages deployment
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      # Step 8: Build with Jekyll
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      # Step 9: Upload artifact for GitHub Pages deployment
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04-x64
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
